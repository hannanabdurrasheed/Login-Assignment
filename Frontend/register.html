<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>

    <style>
        *{ margin:0; padding:0; box-sizing:border-box; font-family:Arial, Helvetica, sans-serif; }

        body{
            background:linear-gradient(135deg,#fff0f5,#ffd6e7);
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .container{
            width:380px;
            background:white;
            padding:40px;
            border-radius:20px;
            box-shadow:0 10px 30px rgba(233,30,99,.25);
            text-align:center;
        }

        .icon{ font-size:60px; margin-bottom:10px; }

        h2{ color:#e91e63; margin-bottom:25px; font-size:30px; }

        input{
            width:100%;
            padding:14px;
            margin:10px 0;
            border:2px solid #f8bbd0;
            border-radius:10px;
            font-size:15px;
        }

        input:focus{
            outline:none;
            border-color:#e91e63;
            box-shadow:0 0 10px rgba(233,30,99,.3);
        }

        button{
            width:100%;
            padding:14px;
            margin-top:15px;
            background:#e91e63;
            color:white;
            border:none;
            border-radius:10px;
            font-size:16px;
            cursor:pointer;
        }

        button:hover{ background:#c2185b; }

        #msg{ margin-top:15px; font-weight:bold; }

        .success{ color:green; }
        .error{ color:red; }

        .link{ margin-top:20px; }

        .link a{
            color:#e91e63;
            text-decoration:none;
            font-weight:bold;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="icon">📝</div>

    <h2>Register</h2>

    <input type="text" id="name" placeholder="👤 Enter your name">
    <input type="email" id="email" placeholder="📧 Enter your Gmail address">
    <input type="password" id="password" placeholder="🔒 Enter your password">

    <button onclick="register()">Register</button>

    <p id="msg"></p>

    <div class="link">
        Already have an account?
        <a href="login.html">Login Here</a>
    </div>

</div>

<script>
async function register(){

    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const message = document.getElementById("msg");

    if(name === "" || email === "" || password === ""){
        message.className = "error";
        message.innerHTML = "Please fill in all fields.";
        return;
    }

    try{
        const response = await fetch("http://localhost:3000/api/auth/register",{
            method:"POST",
            headers:{ "Content-Type":"application/json" },
            body:JSON.stringify({ name, email, password })
        });

        const data = await response.json();

        message.className = response.ok ? "success" : "error";
        message.innerHTML = data.message;

    }catch(error){
        message.className = "error";
        message.innerHTML = "Unable to connect to the server.";
    }
}
</script>

</body>
</html>
